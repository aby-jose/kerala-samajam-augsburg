<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="No image available">
  <!--
    Fallback for events and albums with no cover image. Referenced as
    /images/placeholder.svg; the code previously pointed at
    /images/placeholder.jpg, which was never added to the repository, so every
    event without a cover rendered a broken image.

    Kept as SVG rather than a bitmap: it is a few hundred bytes, stays sharp at
    any size, and can be read and edited in a diff.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <g transform="translate(400 205)" fill="none" stroke="#a1a1aa" stroke-width="6"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="-54" y="-42" width="108" height="84" rx="10"/>
    <circle cx="-22" cy="-14" r="11"/>
    <path d="M-54 26 l34 -32 a6 6 0 0 1 8 0 l26 24 14 -13 a6 6 0 0 1 8 0 l18 17"/>
  </g>

  <text x="400" y="310" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="20" font-weight="500" fill="#71717a">
    No image available
  </text>
</svg>
